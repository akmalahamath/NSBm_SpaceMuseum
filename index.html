<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NSBM Space Museum - Group 58</title>

  <!-- Libraries -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
    }

    /* Video background */
    #arjs-video,
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      margin: 0 !important;
      margin-top: 0 !important;
      margin-left: 0 !important;
      padding: 0 !important;
      object-fit: cover !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    /* Scene and canvas containers */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 1 !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      pointer-events: auto !important;
      z-index: 2 !important;
      background: transparent !important;
    }

    /* Navigation bar */
    .museum-navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: max(10px, env(safe-area-inset-top, 10px)) 16px 10px 16px;
      background: linear-gradient(180deg, rgba(5, 10, 28, 0.94) 0%, rgba(10, 18, 48, 0.82) 100%);
      border-bottom: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 1.25rem;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    .brand-title {
      color: #FFFFFF;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .group-pill {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(139, 92, 246, 0.3));
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #38BDF8;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    /* Marker status banner */
    #status-banner {
      position: fixed;
      top: calc(45px + env(safe-area-inset-top, 0px));
      left: 0;
      width: 100%;
      padding: 7px 12px;
      background-color: #DC2626;
      color: #FFFFFF;
      text-align: center;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: background-color 0.3s ease;
      z-index: 99;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #status-banner .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFFFFF;
      animation: pulseAnim 1.4s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulseAnim {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(0.65);
      }
    }

    /* Bottom interaction guide */
    .bottom-guide {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 18, 48, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 30px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      max-width: 94vw;
    }

    .guide-tip {
      font-size: 0.74rem;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .guide-tip strong {
      color: #FACC15;
    }

    /* Feedback flash notification */
    #touch-flash {
      position: fixed;
      top: calc(88px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(16, 27, 60, 0.95);
      border: 1px solid #38BDF8;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 101;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    #touch-flash.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile responsive adjustments */
    @media (max-width: 480px) {
      .museum-navbar {
        padding: max(8px, env(safe-area-inset-top, 8px)) 10px 8px 10px;
      }

      .brand-title {
        font-size: 0.85rem;
      }

      .brand-icon {
        font-size: 1.15rem;
      }

      .group-pill {
        font-size: 0.68rem;
        padding: 2px 7px;
      }

      #status-banner {
        top: calc(41px + env(safe-area-inset-top, 0px));
        font-size: 0.68rem;
        padding: 6px 8px;
        gap: 6px;
      }

      .bottom-guide {
        font-size: 0.68rem;
        padding: 6px 12px;
        bottom: max(10px, env(safe-area-inset-bottom, 10px));
        gap: 8px;
      }

      .guide-tip {
        font-size: 0.68rem;
      }

      #touch-flash {
        top: calc(80px + env(safe-area-inset-top, 0px));
        font-size: 0.72rem;
        padding: 5px 12px;
      }
    }
  </style>

  <script>
    // Aspect ratio and distortion corrector component
    AFRAME.registerComponent('mobile-aspect-ratio', {
      init: function () {
        this.cameraObj = null;
        var sceneEl = this.el.sceneEl;
        var self = this;

        if (sceneEl.camera) {
          self.cameraObj = sceneEl.camera;
        } else {
          sceneEl.addEventListener('camera-set-active', function (evt) {
            self.cameraObj = evt.detail.cameraEl.getObject3D('camera');
          });
        }

        this.applyCorrection = this.applyCorrection.bind(this);
        window.addEventListener('resize', this.applyCorrection);
        window.addEventListener('orientationchange', function () {
          setTimeout(self.applyCorrection, 100);
          setTimeout(self.applyCorrection, 400);
        });
      },
      tick: function () {
        this.applyCorrection();
      },
      applyCorrection: function () {
        var camera = this.cameraObj;
        if (!camera && this.el.sceneEl) {
          camera = this.el.sceneEl.camera;
          if (camera) this.cameraObj = camera;
        }
        if (!camera || !camera.projectionMatrix) return;

        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w <= 0 || h <= 0) return;

        var screenAspect = w / h;
        var m = camera.projectionMatrix.elements;
        if (!m || m[0] === 0 || m[5] === 0) return;

        var videoAspect = 4 / 3;
        var videoEl = document.getElementById('arjs-video') || document.querySelector('video');
        if (videoEl && videoEl.videoWidth && videoEl.videoHeight) {
          videoAspect = videoEl.videoWidth / videoEl.videoHeight;
        }

        var targetM0 = m[0];
        var targetM5 = m[5];

        if (screenAspect < videoAspect) {
          targetM0 = m[5] / screenAspect;
        } else {
          targetM5 = m[0] * screenAspect;
        }

        if (Math.abs(m[0] - targetM0) > 0.0001 || Math.abs(m[5] - targetM5) > 0.0001) {
          m[0] = targetM0;
          m[5] = targetM5;
          if (camera.projectionMatrixInverse) {
            camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
          }
        }
      }
    });

    // Video positioning helper to guarantee full screen without letterbox bars
    function enforceFullScreenVideo() {
      var video = document.getElementById('arjs-video') || document.querySelector('video');
      if (video) {
        video.style.setProperty('margin', '0px', 'important');
        video.style.setProperty('margin-top', '0px', 'important');
        video.style.setProperty('margin-left', '0px', 'important');
        video.style.setProperty('top', '0px', 'important');
        video.style.setProperty('left', '0px', 'important');
        video.style.setProperty('width', '100vw', 'important');
        video.style.setProperty('height', '100vh', 'important');
        video.style.setProperty('object-fit', 'cover', 'important');
      }
    }

    // Resize and orientation listeners
    window.addEventListener('arjs-video-loaded', function () {
      enforceFullScreenVideo();
      setTimeout(function () {
        enforceFullScreenVideo();
        window.dispatchEvent(new Event('resize'));
      }, 150);
      setTimeout(function () {
        enforceFullScreenVideo();
        window.dispatchEvent(new Event('resize'));
      }, 600);
    });

    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        enforceFullScreenVideo();
        window.dispatchEvent(new Event('resize'));
      }, 250);
    });

    window.addEventListener('resize', enforceFullScreenVideo);

    // Touch feedback toast helper
    function flashFeedback(msg) {
      var toast = document.getElementById('touch-flash');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('active');
      if (window._flashTimer) clearTimeout(window._flashTimer);
      window._flashTimer = setTimeout(function () {
        toast.classList.remove('active');
      }, 1800);
    }

    // Marker detection status component
    AFRAME.registerComponent('marker-status', {
      init: function () {
        var marker = this.el;
        var banner = document.getElementById('status-banner');
        var bannerText = document.getElementById('status-text');

        marker.addEventListener('markerFound', function () {
          if (banner && bannerText) {
            banner.style.backgroundColor = '#10B981';
            bannerText.textContent = 'MARKER FOUND – WELCOME TO NSBM SPACE MUSEUM!';
          }
          flashFeedback('🟢 Marker Locked');
        });

        marker.addEventListener('markerLost', function () {
          if (banner && bannerText) {
            banner.style.backgroundColor = '#DC2626';
            bannerText.textContent = 'MARKER LOST – PLEASE SHOW THE HIRO MARKER.';
          }
        });
      }
    });

    // Earth color changer component
    AFRAME.registerComponent('color-changer', {
      schema: {
        colors: {
          type: 'array',
          default: ['#FFFFFF', '#60A5FA', '#34D399', '#FBBF24', '#F87171', '#C084FC', '#22D3EE']
        }
      },
      init: function () {
        var self = this;
        this.colorIndex = 0;
        var el = this.el;

        el.setAttribute('material', 'color', this.data.colors[this.colorIndex]);

        this.triggerChange = function (evt) {
          if (evt) evt.stopPropagation();
          self.colorIndex = (self.colorIndex + 1) % self.data.colors.length;
          var newColor = self.data.colors[self.colorIndex];
          el.setAttribute('material', 'color', newColor);
          flashFeedback('🌍 Earth Color Shifted');
        };

        el.addEventListener('click', this.triggerChange);
      },
      remove: function () {
        this.el.removeEventListener('click', this.triggerChange);
      }
    });

    // Rocket grow on tap component
    AFRAME.registerComponent('grow-on-tap', {
      schema: {
        enlargedMultiplier: { type: 'number', default: 1.35 }
      },
      init: function () {
        var self = this;
        var el = this.el;

        this.isEnlarged = false;
        var initialScale = el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
        this.normalScale = {
          x: initialScale.x,
          y: initialScale.y,
          z: initialScale.z
        };

        this.triggerGrow = function (evt) {
          if (evt) evt.stopPropagation();
          self.isEnlarged = !self.isEnlarged;
          var mult = self.isEnlarged ? self.data.enlargedMultiplier : 1.0;

          el.setAttribute('scale', {
            x: self.normalScale.x * mult,
            y: self.normalScale.y * mult,
            z: self.normalScale.z * mult
          });

          flashFeedback(self.isEnlarged ? '🚀 Rocket: Enlarged 135%' : '🚀 Rocket: Normal Size');
        };

        el.addEventListener('click', this.triggerGrow);
      },
      remove: function () {
        this.el.removeEventListener('click', this.triggerGrow);
      }
    });
  </script>
</head>

<body>
  <!-- Header navigation bar -->
  <header class="museum-navbar">
    <div class="brand-group">
      <span class="brand-icon">🪐</span>
      <h1 class="brand-title">NSBM SPACE MUSEUM</h1>
    </div>
    <div class="group-pill">GROUP 58</div>
  </header>

  <!-- Marker status banner -->
  <div id="status-banner" role="status">
    <span class="status-indicator"></span>
    <span id="status-text">SEARCHING FOR HIRO MARKER...</span>
  </div>

  <!-- Touch feedback notification toast -->
  <div id="touch-flash">Feedback</div>

  <!-- Bottom interaction guide -->
  <div class="bottom-guide">
    <div class="guide-tip">🌍 Tap <strong>Earth</strong>: Color Shift</div>
    <div style="color: rgba(255,255,255,0.3);">|</div>
    <div class="guide-tip">🚀 Tap <strong>Rocket</strong>: Resize</div>
  </div>

  <!-- Main AR scene -->
  <a-scene embedded vr-mode-ui="enabled: false" mobile-aspect-ratio
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;">

    <!-- Scene assets -->
    <a-assets timeout="10000">
      <a-asset-item id="astronaut-model" src="models/astronaut.glb"></a-asset-item>
      <img id="earth-texture" src="assets/earth.jpg">
      <img id="space-bg-img" src="assets/space-bg.png">
    </a-assets>

    <!-- Scene lighting -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.95;"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.25; position: 1 4 2;"></a-entity>
    <a-entity light="type: point; color: #38BDF8; intensity: 0.8; position: 0 1.5 1;"></a-entity>

    <!-- Hiro marker target -->
    <a-marker preset="hiro" id="hiro-marker-entity" marker-status smooth="true" smoothCount="10" smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- Museum container -->
      <a-entity id="museum-container" rotation="-90 0 0" position="0 0 0" scale="0.95 0.95 0.95">

        <!-- Space backdrop plane -->
        <a-plane id="space-backdrop" position="0 0.55 -0.42" rotation="0 0 0" width="2.3" height="1.95"
          material="src: #space-bg-img; opacity: 0.95; transparent: true; roughness: 0.9;">
        </a-plane>

        <!-- Museum exhibition floor -->
        <a-plane position="0 -0.55 0" rotation="-90 0 0" width="2.3" height="1.6" color="#0B132B"
          material="roughness: 0.8; metalness: 0.3; opacity: 0.9; transparent: true">
        </a-plane>

        <!-- Floor outer ring -->
        <a-ring position="0 -0.54 0" rotation="-90 0 0" radius-inner="0.9" radius-outer="1.0" color="#38BDF8"
          material="opacity: 0.75; transparent: true">
        </a-ring>

        <!-- Floor inner ring -->
        <a-ring position="0 -0.535 0" rotation="-90 0 0" radius-inner="0.5" radius-outer="0.55" color="#8B5CF6"
          material="opacity: 0.6; transparent: true">
        </a-ring>

        <!-- Group header text -->
        <a-text value="GROUP 58" align="center" position="0 1.48 0" scale="0.52 0.52 0.52" color="#38BDF8"
          font="kelsonsans">
        </a-text>

        <!-- Museum header text -->
        <a-text value="NSBM SPACE MUSEUM" align="center" position="0 1.25 0" scale="0.68 0.68 0.68" color="#FACC15"
          font="kelsonsans">
        </a-text>

        <!-- Earth exhibit group -->
        <a-entity id="earth-group" position="-0.65 0.1 0">
          <a-cylinder position="0 -0.55 0" radius="0.26" height="0.14" color="#1E293B"
            material="metalness: 0.6; roughness: 0.4">
          </a-cylinder>
          <a-cylinder position="0 -0.44 0" radius="0.2" height="0.08" color="#334155"
            material="metalness: 0.7; roughness: 0.3">
          </a-cylinder>

          <!-- Rotating earth sphere -->
          <a-sphere id="earth-primitive" class="clickable" position="0 0 0" radius="0.32" src="#earth-texture"
            material="roughness: 0.5; metalness: 0.1;" color-changer
            animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
          </a-sphere>

          <!-- Earth invisible touch hitbox -->
          <a-sphere class="clickable" position="0 0 0" radius="0.4" material="opacity: 0; transparent: true"
            color-changer>
          </a-sphere>

          <!-- Earth orbit ring -->
          <a-ring position="0 0 0" rotation="75 25 0" radius-inner="0.4" radius-outer="0.46" color="#38BDF8"
            material="opacity: 0.5; transparent: true">
          </a-ring>

          <!-- Earth label text -->
          <a-text value="Earth" align="center" position="0 0.5 0" scale="0.32 0.32 0.32" color="#FFFFFF"
            font="kelsonsans">
          </a-text>
        </a-entity>

        <!-- Rocket exhibit group -->
        <a-entity id="rocket-group" class="clickable" position="0.65 0.1 0" grow-on-tap>

          <a-cylinder position="0 -0.55 0" radius="0.26" height="0.14" color="#1E293B"
            material="metalness: 0.6; roughness: 0.4">
          </a-cylinder>
          <a-cylinder position="0 -0.44 0" radius="0.2" height="0.08" color="#334155"
            material="metalness: 0.7; roughness: 0.3">
          </a-cylinder>

          <!-- Rocket invisible touch hitbox -->
          <a-cylinder class="clickable" position="0 0.05 0" radius="0.3" height="0.75"
            material="opacity: 0; transparent: true" grow-on-tap>
          </a-cylinder>

          <!-- Rocket 3D assembly -->
          <a-entity id="rocket-assembly"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">

            <a-cylinder class="clickable" position="0 -0.05 0" radius="0.14" height="0.5" color="#F8FAFC"
              material="metalness: 0.6; roughness: 0.3">
            </a-cylinder>

            <a-cone class="clickable" position="0 0.34 0" radius-bottom="0.14" radius-top="0" height="0.28"
              color="#EF4444" material="metalness: 0.5; roughness: 0.4">
            </a-cone>

            <a-cylinder class="clickable" position="-0.14 -0.1 0" radius="0.06" height="0.36" color="#E2E8F0"
              material="metalness: 0.5; roughness: 0.4">
            </a-cylinder>
            <a-cone class="clickable" position="-0.14 0.13 0" radius-bottom="0.06" radius-top="0" height="0.1"
              color="#EF4444">
            </a-cone>

            <a-cylinder class="clickable" position="0.14 -0.1 0" radius="0.06" height="0.36" color="#E2E8F0"
              material="metalness: 0.5; roughness: 0.4">
            </a-cylinder>
            <a-cone class="clickable" position="0.14 0.13 0" radius-bottom="0.06" radius-top="0" height="0.1"
              color="#EF4444">
            </a-cone>

            <a-box position="0.19 -0.18 0" rotation="0 0 25" depth="0.02" height="0.18" width="0.08"
              color="#EF4444"></a-box>
            <a-box position="-0.19 -0.18 0" rotation="0 0 -25" depth="0.02" height="0.18" width="0.08"
              color="#EF4444"></a-box>
            <a-box position="0 -0.18 0.19" rotation="25 0 0" depth="0.08" height="0.18" width="0.02"
              color="#EF4444"></a-box>
            <a-box position="0 -0.18 -0.19" rotation="-25 0 0" depth="0.08" height="0.18" width="0.02"
              color="#EF4444"></a-box>

            <a-sphere position="0 0.08 0.14" radius="0.04" color="#38BDF8"
              material="metalness: 0.9; roughness: 0.1"></a-sphere>

            <a-cone position="0 -0.34 0" rotation="180 0 0" radius-bottom="0.09" radius-top="0" height="0.12"
              color="#F59E0B" material="emissive: #F59E0B; emissiveIntensity: 0.8; opacity: 0.85; transparent: true">
            </a-cone>
          </a-entity>

          <!-- Rocket label text -->
          <a-text value="Rocket" align="center" position="0 0.6 0" scale="0.32 0.32 0.32" color="#FFFFFF"
            font="kelsonsans">
          </a-text>
        </a-entity>

        <!-- Satellite exhibit group -->
        <a-entity id="satellite-group" position="0 0.82 0"
          animation="property: position; from: -0.32 0.82 0; to: 0.32 0.92 0; dir: alternate; loop: true; dur: 3400; easing: easeInOutSine">

          <a-box position="0 0 0" width="0.18" height="0.18" depth="0.18" color="#CBD5E1"
            material="metalness: 0.8; roughness: 0.2">
          </a-box>

          <a-cylinder position="0 0.11 0" radius="0.06" height="0.04" color="#FACC15"
            material="metalness: 0.9; roughness: 0.2">
          </a-cylinder>

          <a-box position="-0.26 0 0" width="0.3" height="0.12" depth="0.016" color="#1D4ED8"
            material="metalness: 0.6; roughness: 0.2">
          </a-box>

          <a-box position="0.26 0 0" width="0.3" height="0.12" depth="0.016" color="#1D4ED8"
            material="metalness: 0.6; roughness: 0.2">
          </a-box>

          <a-cylinder position="0 -0.14 0" radius="0.01" height="0.1" color="#94A3B8"></a-cylinder>
          <a-sphere position="0 -0.19 0" radius="0.02" color="#EF4444"></a-sphere>

          <!-- Satellite label text -->
          <a-text value="Satellite" align="center" position="0 0.24 0" scale="0.28 0.28 0.28" color="#38BDF8"

        <!-- Astronaut exhibit group -->
        <a-entity id="astronaut-group" position="0 -0.05 0">
          <a-cylinder position="0 -0.52 0" radius="0.28" height="0.14" color="#1E293B"
            material="metalness: 0.6; roughness: 0.4">

          <a-cylinder position="0 -0.42 0" radius="0.24" height="0.08" color="#334155"
